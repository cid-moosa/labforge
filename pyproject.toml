[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "brahmastra"
version = "1.0.0"
description = "Zero-touch autonomous lab record automation engine & AI skill for OOXML alignment, smart image bounding boxes, and verified PDF generation."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "cid-moosa"}
]
keywords = [
    "ooxml",
    "docx",
    "pdf",
    "automation",
    "lab-record",
    "ai-agent",
    "antigravity",
    "forensics",
    "cyber-forensics"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Education",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Processing :: Markup",
    "Topic :: Education"
]
dependencies = [
    "python-docx>=1.1.0",
    "Pillow>=10.0.0",
    "PyMuPDF>=1.23.0",
    "lxml>=5.0.0"
]

[project.scripts]
brahmastra = "scripts.brahmastra_engine:main"
brahmastra-inspect = "scripts.inspect_record:main"
brahmastra-verify = "scripts.verify_pdf:main"

[project.urls]
Homepage = "https://github.com/cid-moosa/brahmastra"
Repository = "https://github.com/cid-moosa/brahmastra"
Issue-Tracker = "https://github.com/cid-moosa/brahmastra/issues"
